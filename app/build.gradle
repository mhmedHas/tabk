plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.module_android_demo'

    compileSdk 34

    defaultConfig {
        applicationId 'com.example.module_android_demo'

        minSdk 24
        targetSdk 25

        versionCode 1
        versionName "1.0"
    }
    // ⬇️ ضيف البلوك ده هنا
    signingConfigs {
        release {
            storeFile rootProject.file(" jewelry-release-key.jks")   // عدّل المسار لمكان ملف الـ keystore عندك
            storePassword "Y0u55ef.he1a1"                    // نفس الباسورد اللي حطيته
            keyAlias "key0"                                  // اسم الـ Alias اللي اخترته
            keyPassword "Y0u55ef.he1a1"                      // باسورد الـ Alias (ممكن يكون نفس storePassword)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }

        debug {
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "uhfdemo-v${variant.versionName}-${curtime()}.apk"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def curtime() {
    return new Date().format(
            "yyMMdd",
            TimeZone.getTimeZone("GMT+08:00")
    )
}

dependencies {

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation files('libs\\commons-math3-3.6.1.jar')
    implementation files('libs\\uhf.jar')
    implementation 'com.android.support:recyclerview-v7:25.0.0'

    // Firebase (BoM بيتحكم في نسخ كل مكتبات Firebase مع بعض)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // Local JAR / AAR files
    implementation fileTree(
            dir: 'libs',
            includes: ['*.jar', '*.aar']
    )
}